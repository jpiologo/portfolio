    <rect x="1000" y="190" width="440" height="120" rx="18" fill="#1C1F26" stroke="#2C3040" stroke-width="3"/>
    <text x="1220" y="261">external app</text>

    <rect x="1000" y="390" width="440" height="120" rx="18" fill="#1C1F26" stroke="#FBBF24" stroke-width="4"/>
    <text x="1220" y="461" fill="#FBBF24">OAuth 1.0a</text>

    <rect x="1000" y="590" width="440" height="120" rx="18" fill="#1C1F26" stroke="#22C55E" stroke-width="4"/>
    <text x="1220" y="661" fill="#22C55E">content.values[]</text>
  </g>
  <g stroke="#1E88E5" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M1220 322 V376 M1210 366 L1220 378 L1230 366"/>
