<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111318"/>
      <stop offset="1" stop-color="#0E4D8A"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1380" cy="140" r="280" fill="#1E88E5" opacity="0.12"/>

  <text x="120" y="250" font-family="Fira Code, Courier New, monospace" font-size="64" font-weight="700" fill="#E8EAF0">CI/CD for Fluig</text>
  <text x="120" y="320" font-family="system-ui, sans-serif" font-size="40" fill="#9CA3AF">Jenkins + Fluig REST API</text>

  <!-- Pipeline stages -->
  <g font-family="Fira Code, Courier New, monospace" font-size="30" font-weight="700" fill="#E8EAF0">
    <rect x="120" y="470" width="260" height="110" rx="18" fill="#1C1F26" stroke="#2C3040" stroke-width="3"/>
    <text x="250" y="535" text-anchor="middle">git push</text>

    <rect x="460" y="470" width="260" height="110" rx="18" fill="#1C1F26" stroke="#2C3040" stroke-width="3"/>
    <text x="590" y="535" text-anchor="middle">git diff</text>

    <rect x="800" y="470" width="260" height="110" rx="18" fill="#1C1F26" stroke="#2C3040" stroke-width="3"/>
    <text x="930" y="535" text-anchor="middle">OAuth 1.0</text>

    <rect x="1140" y="470" width="340" height="110" rx="18" fill="#1C1F26" stroke="#22C55E" stroke-width="4"/>
    <text x="1310" y="535" text-anchor="middle" fill="#22C55E">deploy ✓</text>
  </g>
  <g stroke="#1E88E5" stroke-width="5" fill="none" stroke-linecap="round">
    <path d="M385 525 H450 M440 515 L452 525 L440 535"/>
    <path d="M725 525 H790 M780 515 L792 525 L780 535"/>
    <path d="M1065 525 H1130 M1120 515 L1132 525 L1120 535"/>
  </g>

  <text x="120" y="720" font-family="Fira Code, Courier New, monospace" font-size="30" fill="#1E88E5">POST /dataset/api/v2/datasets</text>
</svg>
