<!doctype html>
<!-- The build sets lang, title and metadata for each page (vite-plugin-seo.ts); React keeps lang in sync afterwards. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- "JP." logo: the SVG adapts to the browser's light/dark theme, the .ico is the fallback -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      // Portuguese lives under /pt. Visitors whose browser prefers it go there, unless they picked English
      // in the header (prefix and storage keys from src/i18n/routes.ts)
      (function () {
        if (/^\/pt(\/|$)/.test(location.pathname)) return;
        var language;
        try {
          if (localStorage.getItem('languageChosenByVisitor') === 'true') language = localStorage.getItem('language');
        } catch (e) {}
        if (!language) {
          language = (navigator.languages || [navigator.language])
            .map(function (code) { return code.slice(0, 2).toLowerCase(); })
            .find(function (code) { return code === 'pt' || code === 'en'; });
        }
        if (language !== 'pt') return;
        location.replace('/pt' + (location.pathname === '/' ? '' : location.pathname) + location.search + location.hash);
      })();
    </script>
    <!-- Replaced by the tags of each page on build -->
    <title>João Piologo - Software Engineer</title>
    <!-- Filled in with the page background by src/lib/theme.ts -->
    <meta name="theme-color" content="" />
    <script>
      // Apply saved (or system) theme before first paint to avoid a flash
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
    <noscript>
      <style>
        .reveal { opacity: 1 !important; transform: none !important; }
      </style>
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
