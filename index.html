<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- "JP." logo: the SVG adapts to the browser's light/dark theme, the .ico is the fallback -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Replaced by the SEO tags from vite-plugin-seo.ts -->
    <title>João Piologo - Software Engineer</title>
    <!-- Site fonts are not set here: vite-plugin-fonts.ts injects them from fonts.config.ts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Serif fonts the "code" word in the hero cycles through -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Bodoni+Moda:wght@700&family=Cormorant+Garamond:ital,wght@1,600&family=DM+Serif+Display&family=Fraunces:ital,wght@1,600&family=Libre+Baskerville:ital@1&family=Playfair+Display:ital,wght@1,600&display=swap"
    />
    <script>
      // Apply saved (or system) theme before first paint to avoid a flash
      (function () {
        var theme;
        try { theme = localStorage.getItem('theme'); } catch (e) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        if (theme === 'dark') document.documentElement.classList.add('dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
